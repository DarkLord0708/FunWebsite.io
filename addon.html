<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="addon.css">
</head>
<body>
  <div class="navbar">
    &nbsp;

    &nbsp;<font id="separator">|</font>&nbsp;
    <a class="navlink" href="euler.html" id="inactive"><font size="5">Nerdy_Maths</font></a>

    &nbsp;<font id="separator">|</font>&nbsp;
    <a class="navlink" href="addon.html" id="active"><font size="5">A Surprise</font></a>
  </div>

  <div class="content">
    <center>
      <p id="Title">Unveil The Surprise</p>
      <p id="text" style="font-size: 25px;">Enter the password to reveal what's hidden.</p>

      <form id="passwordForm" class="password-boxes">
        <input type="password" maxlength="1" class="digit-input" required>
        <input type="password" maxlength="1" class="digit-input" required>
        <input type="password" maxlength="1" class="digit-input" required>
        <input type="password" maxlength="1" class="digit-input" required>
        <input type="password" maxlength="1" class="digit-input" required>
        <input type="password" maxlength="1" class="digit-input" required>
        <button type="submit">Unlock</button>
      </form>

      <div id="downloadSection" style="display:none; margin-top:20px;">
            <a href="https://drive.google.com/file/d/1ivo0akJ3efwLZjVu0yy8ZQpe93JLEV3z/view?usp=sharing" 
            target="_blank" 
            class="download-btn">
            Download Now 🎬
            </a>
      </div>


  <script>
    const form = document.getElementById("passwordForm");
    const downloadSection = document.getElementById("downloadSection");
    const correctPassword = "372631"; 

    // auto-focus jumps to next box
    document.querySelectorAll(".digit-input").forEach((input, idx, arr) => {
      input.addEventListener("input", () => {
        if (input.value && idx < arr.length - 1) {
          arr[idx + 1].focus();
        }
      });
    });

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const entered = Array.from(document.querySelectorAll(".digit-input"))
        .map(input => input.value)
        .join("");

      if (entered === correctPassword) {
        downloadSection.style.display = "block";
        form.style.display = "none";
      } else {
        alert("Incorrect password!");
        form.reset();
        document.querySelector(".digit-input").focus();
      }
    });
  </script>
</body>
</html>
